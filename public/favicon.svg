<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Triangle Clip Path -->
    <clipPath id="icon-clip">
      <path d="M 60 80 C 60 50, 95 30, 120 45 L 430 225 C 455 240, 455 275, 430 290 L 120 470 C 95 485, 60 465, 60 435 Z" />
    </clipPath>

    <!-- Shading Overlay Gradient -->
    <linearGradient id="overlay-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Icon Group -->
  <g id="play-icon">
    <!-- Base Shape for Smooth Corners -->
    <path d="M 60 80 C 60 50, 95 30, 120 45 L 430 225 C 455 240, 455 275, 430 290 L 120 470 C 95 485, 60 465, 60 435 Z" fill="#6a3075" />

    <!-- Abstract Color Bands Inside Triangle -->
    <g clip-path="url(#icon-clip)">
      <!-- Deep Purple Bottom Left Base -->
      <rect x="0" y="0" width="500" height="500" fill="#4a225d"/>
      
      <!-- Violet / Purple Layers -->
      <path d="M 0 300 Q 150 280, 250 350 L 250 500 L 0 500 Z" fill="#69307d"/>
      <path d="M 0 220 Q 180 200, 280 280 L 280 500 L 0 500 Z" fill="#933e85"/>
      
      <!-- Magenta / Pink Layers -->
      <path d="M 0 140 Q 180 130, 310 220 L 320 500 L 0 500 Z" fill="#bc4c80"/>
      <path d="M 0 50 Q 200 80, 340 180 L 350 500 L 0 500 Z" fill="#db5973"/>
      
      <!-- Coral / Orange Layers -->
      <path d="M 80 0 Q 240 50, 380 140 L 400 500 L 80 0 Z" fill="#ea6f58"/>
      <path d="M 180 0 Q 280 40, 420 110 L 500 500 L 180 0 Z" fill="#f08f4c"/>
      <path d="M 270 0 Q 330 30, 450 120 L 500 500 L 270 0 Z" fill="#f4ad47"/>
      
      <!-- Yellow Top Right Section -->
      <path d="M 350 0 L 500 0 L 500 350 Q 420 200, 350 0 Z" fill="#f8cd53"/>

      <!-- Overlay Depth Gradient -->
      <rect x="0" y="0" width="500" height="500" fill="url(#overlay-grad)"/>
    </g>

    <!-- White Continuous Line Art (Camel Shape Path) -->
    <path d="M 80 270 
             C 75 230, 105 210, 135 225 
             C 160 238, 175 280, 205 285 
             C 235 290, 240 200, 280 190 
             C 315 180, 335 250, 375 220 
             C 410 195, 425 210, 450 240 
             M 425 220 L 450 270" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95"/>
  </g>
</svg>
